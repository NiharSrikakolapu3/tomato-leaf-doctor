[project]
name = "leaf-doctor-classifier"
version = "0.1.0"
description = "P2: EfficientNet-B0 disease classifier for Leaf Doctor (8 tomato classes; baseline vs change arm, PlantVillage + PlantDoc)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[project.scripts]
pv-download = "classifier.data:download_cli"
pv-train = "classifier.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classifier"]

# CUDA 13.0 wheels (needed for RTX 50-series / Blackwell; also fine on Colab).
# On a CPU-only or older-driver machine, change the index URL (e.g. .../whl/cu126 or .../whl/cpu).
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
